<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>To-Do List</title>
        <link rel="stylesheet" href="to-do-list.css" />
    </head>

    <body>
        <div class="todo-app">
            <header>
                <div class="logo">
                    <div class="brand-wrap">
                        <span class="eyebrow">Daily planner</span>
                        <h1>To-Do List</h1>
                    </div>
                    <button
                        id="mode-btn"
                        type="button"
                        onclick="myFunction()"
                        aria-label="Switch to dark mode"
                        title="Switch to dark mode"
                    >
                        <svg
                            class="sun-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="4"></circle>
                            <path
                                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
                            ></path>
                        </svg>
                    </button>
                </div>
                <section class="dashboard-summary" aria-label="Today's overview">
                    <div class="dashboard-greeting">
                        <p id="greeting-label">Your day, organized.</p>
                        <time id="today-date"></time>
                    </div>
                    <div class="dashboard-progress">
                        <span id="progress-label">0 of 0 tasks complete</span>
                        <progress
                            id="task-progress"
                            value="0"
                            max="1"
                            aria-label="Task completion progress"
                        ></progress>
                    </div>
                </section>
            </header>

            <div class="quote-box" id="quote-box">
                <p class="quote-text" id="quote-text">
                    Loading a little motivation...
                </p>
                <p class="quote-author" id="quote-author"></p>
            </div>

            <form id="task-form" class="composer">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Add a task..."
                    autocomplete="off"
                />
                <button id="add-btn" type="submit">Add</button>
            </form>

            <!-- DUE DATE + PRIORITY -->
            <div class="due-row">
                <label for="due-input">
                    Due date <input type="date" id="due-input" />
                </label>
                <label for="priority-input">
                    Priority
                    <select id="priority-input">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </label>
            </div>

            <p class="error-msg" id="error-msg"></p>

            <!-- SEARCH + SORT -->
            <div class="toolbar">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Search tasks..."
                    autocomplete="off"
                />
                <select id="sort-select" class="sort-select">
                    <option value="manual">Manual order</option>
                    <option value="due">Sort by due date</option>
                    <option value="priority">Sort by priority</option>
                </select>
            </div>

            <!-- FILTER TABS -->
            <div class="filters">
                <button
                    class="filter-btn active"
                    data-filter="all"
                    type="button"
                >
                    All
                </button>
                <button class="filter-btn" data-filter="active" type="button">
                    Active
                </button>
                <button class="filter-btn" data-filter="done" type="button">
                    Done
                </button>
            </div>

            <div class="list-meta">
                <span id="count-label">0 tasks</span>
                <span id="done-label"></span>
            </div>

            <div class="task-list-container">
                <ul id="task-list"></ul>
                <div class="empty-state" id="empty-state">
                    <p class="empty-title" id="empty-title">
                        Nothing on your list yet
                    </p>
                    <p class="empty-message" id="empty-message">
                        Add a task above to get started.
                    </p>
                </div>
            </div>
        </div>

        <dialog
            class="task-detail-dialog"
            id="task-detail-dialog"
            aria-labelledby="task-detail-heading"
        >
            <form class="task-detail-form" id="task-detail-form">
                <header class="task-detail-header">
                    <div>
                        <span class="eyebrow">Task details</span>
                        <h2 id="task-detail-heading"></h2>
                    </div>
                    <button
                        class="detail-close"
                        id="task-detail-close"
                        type="button"
                        aria-label="Close task details"
                    >
                        &times;
                    </button>
                </header>
                <div class="task-detail-grid">
                    <label class="detail-field detail-description" for="detail-note">
                        Description / notes
                        <textarea
                            id="detail-note"
                            placeholder="Add details about this task..."
                        ></textarea>
                    </label>
                    <aside class="task-detail-sidebar" aria-label="Task properties">
                        <label class="detail-field" for="detail-title">
                            Task name
                            <input id="detail-title" type="text" required />
                        </label>
                        <label class="detail-field" for="detail-due">
                            Due date
                            <input id="detail-due" type="date" />
                        </label>
                        <label class="detail-field" for="detail-priority">
                            Priority
                            <select id="detail-priority">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </label>
                        <label class="detail-field" for="detail-status">
                            Status
                            <select id="detail-status"></select>
                        </label>
                        <label class="detail-completion" for="detail-done">
                            <input id="detail-done" type="checkbox" />
                            Mark as complete
                        </label>
                    </aside>
                </div>
                <footer class="task-detail-actions">
                    <button class="detail-cancel" id="task-detail-cancel" type="button">
                        Cancel
                    </button>
                    <button class="detail-save" type="submit">Save changes</button>
                </footer>
            </form>
        </dialog>

        <!-- UNDO TOAST -->
        <div class="toast" id="toast">
            <span id="toast-msg">Task deleted</span>
            <button id="toast-undo" type="button">Undo</button>
        </div>

        <script src="to-do-list.js" defer></script>
    </body>
</html>
